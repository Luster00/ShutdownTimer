name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/ShutdownTimer/ShutdownTimer.csproj

      - name: Build
        run: dotnet build src/ShutdownTimer/ShutdownTimer.csproj -c Release --no-restore
